
# fieldkit_overrides.yaml - shipped defaults for fieldkit's schema-driven
# form field generation.
#
# Every *_id or integer column in a v_*_detail view MUST have an entry
# here (or in the user override at ~/.config/curator/fieldkit_overrides.yaml)
# or the app will refuse to start — see FieldSchemaError.
#
# Structure:
#   <schema-qualified view name>:
#     <column name>:
#       control:  select | text | textarea | date | number | checkbox | hidden
#       label:    Human-readable label (optional — defaults to Title Case)
#       source:   Lookup name for select controls (not yet wired to
#                 anything — api.get_lookup() doesn't exist yet)
#       required: true/false (optional, default false)
#       readonly: true/false (optional, default false) — shown but not
#                 editable; applies to text, textarea, number and date
#       placeholder: Hint text shown in an empty input (optional)
#       rows:     Textarea height in text rows (optional)
#       maxlength: Longest value a text input accepts (optional)
#       row:      Layout — adjacent fields with the same "row" value share
#                 one line of the form (optional; any name)
#       flex:     Layout — relative width within a shared line (optional,
#                 default 1)
#       tab:      Layout — label of a separate tab that holds the field
#                 instead of the Details form (optional; fields with the
#                 same label share a tab, which fills the panel — for long
#                 text such as notes)
#     A column that only needs layout hints still needs an explicit
#     "control:" — an entry replaces the type-based default.
#
# UNVERIFIED as of 2026-07-04 — confirmed only that type_id/status_id
# are project fields. Check \d+ projects.v_project_detail in pgAdmin for
# the full column list (including whether parent_id is present) before
# relying on this file, and add any missing *_id entries for contacts/
# organizations if their views turn out to have FK columns of their own.

projects.v_project_detail:
  type_id:
    control: select
    label: Type
    source: project_types
  status_id:
    control: select
    label: Status
    source: project_statuses
  crew_role_id:
    control: select
    label: Crew
    source: crew_roles
    # The crew role that owns the project and whose dashboard shows it
    # (steward 10h_crew_role_seanchai.sql). Pre-filled with the current
    # dashboard's role for new projects (window.newRecordDefaults).

projects.v_task_detail:
  project_id:
    control: hidden
    # Pre-filled from context (the parent Project) via the query param
    # panel_new() forwards into the record dict — e.g.
    # /panel/tasks/new?project_id=12. Never user-editable; a subtask's
    # panel always opens from its parent task/project, never a bare
    # form the person fills in project_id on themselves.
  parent_id:
    control: hidden
    # Same reasoning as project_id. Empty ('') for a top-level task.
    # Subtask creation (pre-filling parent_id from the parent task) is
    # part of the Subtasks feature — deferred, see
    # nested_master_detail_design.md's "Deferred" section.
  status_id:
    control: select
    label: Status
    source: task_statuses
  priority_id:
    control: select
    label: Priority
    source: priorities

seanchai.v_record_detail:
  record_id:
    control: text
    label: Record ID
    readonly: true
    placeholder: Assigned on save
    row: identity
    flex: 2
    # Ledger key (e.g. PR-001), a varchar, not an FK. Named *_id so
    # fieldkit requires an explicit control for it. Assigned by
    # api.save_record on insert (<type code>-NNN, see steward
    # 10f_seanchai_autonumber.sql) and never renumbered, so it is
    # display-only here.
  type_code:
    control: hidden
    row: identity
    # Hidden fields carry the same "row" as their neighbours: they sit
    # between Type and Status in the view's column order, and a field
    # without a row value would split the identity line in two.
    # Derived from record_type_id by the view join; the Type dropdown
    # already shows it, and api.save_record ignores it.
  record_type:
    control: hidden
    row: identity
    # Same — derived name for record_type_id.
  status:
    control: hidden
    row: identity
    # Same — derived name for record_status_id (the Status dropdown).
  record_type_id:
    control: select
    label: Type
    source: record_types
    row: identity
    flex: 3
  record_status_id:
    control: select
    label: Status
    source: record_statuses
    row: identity
    flex: 2
  display_order:
    control: hidden
    row: identity
    # Manual ledger sort position (lists order by display_order, then
    # record_id). Hidden, not removed: the form still submits the current
    # value, so existing order numbers are preserved. Carries the identity
    # row value so it doesn't split the line between Status and Year.
  year:
    control: text
    label: Year
    row: identity
    flex: 1
    # Text, not number: records.year is not an integer column. Listed
    # here only to carry the layout hints.
  county:
    control: text
    label: County
    row: location
    flex: 3
  state:
    control: text
    label: State / Province
    row: location
    flex: 2
    maxlength: 50
    # Free text: records outside the US (provinces, counties of other
    # countries) use the same box.
  country:
    control: text
    label: Country
    row: location
    flex: 3
    # Added by steward 10l_seanchai_country_and_form_view.sql.
  notes:
    control: textarea
    label: Notes
    tab: Notes
    # Long text: its own tab, filling the panel, rather than a box inside
    # the Details scroll area.

seanchai.v_search_detail:
  source:
    control: text
    label: Source
    placeholder: e.g. FamilySearch Full Text
    row: where
    flex: 2
    # Where the search was run, free text (steward 10m). First in the view,
    # so it opens the form together with Search URL.
  search_url:
    control: text
    label: Search URL
    placeholder: Paste the results page URL (double-click the summary above to open it)
    row: where
    flex: 5
    # The results page as it was run; opening it re-runs the search. Opened
    # from the summary box at the top of the Details tab (search-summary.js).
  search_id:
    control: text
    label: Search ID
    readonly: true
    placeholder: Assigned on save
    row: identity
    flex: 2
    # Ledger key (e.g. SRCH-001), a varchar, not an FK. Assigned by
    # api.save_search on insert (SRCH-NNN) — display-only here.
  search_terms:
    control: textarea
    label: Search Terms
    rows: 2
    row: identity
    flex: 5
    # Stays a textarea (two lines) so a multi-line term list survives a
    # round trip; shares the identity line with Search ID.
  county_scope:
    control: text
    label: County Scope
    row: scope
    flex: 3
    # Was a tall textarea. Holds a one-line path such as "United States
    # of America → Pennsylvania → Washington County".
  year_filter:
    control: text
    label: Year Filter
    row: scope
    flex: 2
    # One-line value such as "From 1800 AD".
  result_count:
    control: number
    label: Result Count
    row: outcome
    flex: 1
  status:
    control: text
    label: Status
    row: outcome
    flex: 1
  notes:
    control: textarea
    label: Notes
    tab: Notes
    # Long text: its own tab, filling the panel, like records. Sits
    # between Status and Searched At in the view's column order, but a
    # tab-hinted field takes no part in the Details lines, so the
    # outcome line stays unbroken.
  searched_at:
    control: text
    label: Searched At
    row: outcome
    flex: 2
    # timestamp column: fieldkit's default control for it is text, so
    # this entry only carries the layout hints.
