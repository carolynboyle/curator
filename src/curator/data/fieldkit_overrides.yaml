
# fieldkit_overrides.yaml - shipped defaults for fieldkit's schema-driven
# form field generation.
#
# Every *_id or integer column in a v_*_detail view MUST have an entry
# here (or in the user override at ~/.config/curator/fieldkit_overrides.yaml)
# or the app will refuse to start — see FieldSchemaError.
#
# Structure:
#   <schema-qualified view name>:
#     <column name>:
#       control:  select | text | textarea | date | number | checkbox | hidden
#       label:    Human-readable label (optional — defaults to Title Case)
#       source:   Lookup name for select controls (not yet wired to
#                 anything — api.get_lookup() doesn't exist yet)
#       required: true/false (optional, default false)
#       readonly: true/false (optional, default false) — shown but not
#                 editable; applies to text, textarea, number and date
#       placeholder: Hint text shown in an empty input (optional)
#
# UNVERIFIED as of 2026-07-04 — confirmed only that type_id/status_id
# are project fields. Check \d+ projects.v_project_detail in pgAdmin for
# the full column list (including whether parent_id is present) before
# relying on this file, and add any missing *_id entries for contacts/
# organizations if their views turn out to have FK columns of their own.

projects.v_project_detail:
  type_id:
    control: select
    label: Type
    source: project_types
  status_id:
    control: select
    label: Status
    source: project_statuses

projects.v_task_detail:
  project_id:
    control: hidden
    # Pre-filled from context (the parent Project) via the query param
    # panel_new() forwards into the record dict — e.g.
    # /panel/tasks/new?project_id=12. Never user-editable; a subtask's
    # panel always opens from its parent task/project, never a bare
    # form the person fills in project_id on themselves.
  parent_id:
    control: hidden
    # Same reasoning as project_id. Empty ('') for a top-level task.
    # Subtask creation (pre-filling parent_id from the parent task) is
    # part of the Subtasks feature — deferred, see
    # nested_master_detail_design.md's "Deferred" section.
  status_id:
    control: select
    label: Status
    source: task_statuses
  priority_id:
    control: select
    label: Priority
    source: priorities

seanchai.v_record_detail:
  record_id:
    control: text
    label: Record ID
    readonly: true
    placeholder: Assigned on save
    # Ledger key (e.g. PR-001), a varchar, not an FK. Named *_id so
    # fieldkit requires an explicit control for it. Assigned by
    # api.save_record on insert (<type code>-NNN, see steward
    # 10f_seanchai_autonumber.sql) and never renumbered, so it is
    # display-only here.
  type_code:
    control: hidden
    # Derived from record_type_id by the view join; the Type dropdown
    # already shows it, and api.save_record ignores it.
  record_type:
    control: hidden
    # Same — derived name for record_type_id.
  status:
    control: hidden
    # Same — derived name for record_status_id (the Status dropdown).
  record_type_id:
    control: select
    label: Type
    source: record_types
  record_status_id:
    control: select
    label: Status
    source: record_statuses
  display_order:
    control: number
    label: Display Order

seanchai.v_search_detail:
  search_id:
    control: text
    label: Search ID
    readonly: true
    placeholder: Assigned on save
    # Ledger key (e.g. SRCH-001), a varchar, not an FK. Assigned by
    # api.save_search on insert (SRCH-NNN) — display-only here.
  result_count:
    control: number
    label: Result Count
