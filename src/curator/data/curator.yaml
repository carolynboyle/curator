# curator.yaml - Curator default configuration
#
# This file ships with the Curator and provides defaults.
# To override, create ~/.config/curator/curator.yaml with only
# the keys you want to change. You do not need to repeat keys
# that match the defaults.
#
# The database connection is configured separately in
# ~/.config/dev-utils/config.yaml under the 'dbkit:' key.
# Passwords are handled by ~/.pgpass — never put credentials here.

branding:
  site_title: "Curator"
  site_subtitle: "Navigate the Project Crew"
  site_icon: "🎭"

server:
  host: "127.0.0.1"      # Override with Tailscale IP in production
  port: 8080

ui:
  page_size: 25           # Rows per page in list views
  date_format: "%Y-%m-%d"
  theme: "dark"          # Phase 1: read from here
                          # Phase 3: read from settings table instead

crew:
  roles:
    - name: "captain"
      title: "The Captain"
      description: "Full admin access to all projects and records"
    - name: "mechanic"
      title: "The Mechanic"
      description: "Hardware management and refurb tracking"
    - name: "envoy"
      title: "The Envoy"
      description: "Connection tracking and coordination"
    - name: "scribe"
      title: "The Scribe"
      description: "Writing projects and documentation"
    - name: "seanchai"
      title: "The Seanchaí"
      description: "Family history research and the memoir"
      # Floating popups opened from the dashboard's navbar (see
      # curator/popups.py and static/js/popup-shell.js). "links" shows the
      # Links list of the project with the given slug. Remember that lists
      # in ~/.config/curator/curator.yaml replace these wholesale: if your
      # user file defines crew.roles, copy popups there too.
      popups:
        - id: "resources"
          label: "Resources"
          type: "links"
          shortcut: "alt+r"
          project: "genealogy-resources"

seanchai:
  # Base URL for links to transcription files (md_path on a record's parts
  # is relative to the repo root). Point this at your own repo — override in
  # ~/.config/curator/curator.yaml. Leave empty to show the path as plain
  # text instead of a link.
  repo_blob_base: "https://github.com/carolynboyle/seanchai/blob/main/"
  # Status choices for a record part, in the order they appear. Must match
  # the CHECK on seanchai.record_documents.status (steward 10k).
  document_statuses:
    - not_transcribed
    - raw
    - cleaned
    - verified
  # The one-line summary at the top of a search's Details tab (see
  # static/js/search-summary.js). It joins the listed fields, skipping empty
  # ones, and updates as you type. Double-clicking it opens the search's
  # saved Search URL. last_segment shows only the part after the last
  # occurrence of that text (county scope is a path such as
  # "United States of America → Pennsylvania → Washington County").
  search_summary:
    separator: " · "
    parts:
      - field: source
      - field: search_terms
      - field: county_scope
        last_segment: "→"
      - field: year_filter

plugin:
  name: "The Curator"
  version: "0.2.0"
  description: "Web UI and database interface for the projects database"
  type: "web"
  crew_member: "curator"