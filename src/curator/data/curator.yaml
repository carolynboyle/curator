# curator.yaml - Curator default configuration
#
# This file ships with the Curator and provides defaults.
# To override, create ~/.config/curator/curator.yaml with only
# the keys you want to change. You do not need to repeat keys
# that match the defaults.
#
# The database connection is configured separately in
# ~/.config/dev-utils/config.yaml under the 'dbkit:' key.
# Passwords are handled by ~/.pgpass — never put credentials here.

branding:
  site_title: "Curator"
  site_subtitle: "Navigate the Project Crew"
  site_icon: "🎭"

server:
  host: "127.0.0.1"      # Override with Tailscale IP in production
  port: 8080

ui:
  page_size: 25           # Rows per page in list views
  date_format: "%Y-%m-%d"
  theme: "dark"          # Phase 1: read from here
                          # Phase 3: read from settings table instead

crew:
  roles:
    - name: "captain"
      title: "The Captain"
      description: "Full admin access to all projects and records"
    - name: "mechanic"
      title: "The Mechanic"
      description: "Hardware management and refurb tracking"
    - name: "envoy"
      title: "The Envoy"
      description: "Connection tracking and coordination"
    - name: "scribe"
      title: "The Scribe"
      description: "Writing projects and documentation"
    - name: "seanchai"
      title: "The Seanchaí"
      description: "Family history research and the memoir"
      # Floating popups opened from the dashboard's navbar (see
      # curator/popups.py and static/js/popup-shell.js). "links" shows the
      # Links list of the project with the given slug. Remember that lists
      # in ~/.config/curator/curator.yaml replace these wholesale: if your
      # user file defines crew.roles, copy popups there too.
      popups:
        - id: "resources"
          label: "Resources"
          type: "links"
          shortcut: "alt+r"
          project: "genealogy-resources"

seanchai:
  # Base URL for links to transcription files (md_path on a record's parts
  # is relative to the repo root). Point this at your own repo — override in
  # ~/.config/curator/curator.yaml. Leave empty to show the path as plain
  # text instead of a link.
  repo_blob_base: "https://github.com/carolynboyle/seanchai/blob/main/"
  # Status choices for a record part, in the order they appear. Must match
  # the CHECK on seanchai.record_documents.status (steward 10k).
  document_statuses:
    - not_transcribed
    - raw
    - cleaned
    - verified
  # The one-line summary at the top of a search's Details tab (see
  # static/js/search-summary.js). It joins the listed fields, skipping empty
  # ones, and updates as you type. Double-clicking it opens the search's
  # saved Search URL. last_segment shows only the part after the last
  # occurrence of that text (county scope is a path such as
  # "United States of America → Pennsylvania → Washington County").
  search_summary:
    separator: " · "
    parts:
      - field: source
      - field: search_terms
      - field: county_scope
        last_segment: "→"
      - field: year_filter

# =============================================================================
# LIST-AND-EDIT TABS
# =============================================================================
# Tabs on a detail panel that show a searchable list of child items on the
# left and an edit form on the right. One generic widget draws them all
# (static/js/list-edit-widget.js, curator/list_edit.py); each entry below only
# fills in the blanks. Keyed by the entity whose panel shows the tab.
#
#   id, label, noun       tab slug, tab/header text, "document" in messages
#   parent_key            field the server expects for the parent's id (sent
#                         when creating an item)
#   list_url              GET; {parent_id} is replaced
#   save_new_url          POST for a new item
#   save_url              POST for an existing item; {id} is replaced
#   delete_url            DELETE; {id} is replaced
#   title_field           field shown as the item's name in the list
#   title_fallback        shown when that field is blank; {field} placeholders
#                         are filled from the item
#   prefix_field          optional field shown before the name (e.g. a number)
#   subtitle_field        optional field shown under the name
#   badge_field           optional field shown as a small chip
#   badge_tones           optional chip value -> accent | dim
#   search_fields         fields the search box looks through
#   empty_text            message for an empty list
#   require_one_of        optional: {fields: [...], message: "..."} - at least
#                         one must be filled before saving
#   duplicate_of          optional: warn before adding an item whose values
#                         for these fields match an existing one
#   repo_base_from        optional dotted name (section.key) of the base URL
#                         that fields with open: repo are joined onto
#   fields                the edit form: name, label, control (text | select),
#                         placeholder, required, open (url | repo: adds an
#                         "open in a new tab" button), options or options_from
#                         (dotted section.key) for selects
#
# In ~/.config/curator/curator.yaml, entities merge but a tab list replaces
# the shipped one for that entity, so copy every tab you want to keep.
list_edit_tabs:
  records:
    - id: "documents"
      label: "Documents"
      noun: "document"
      parent_key: "record_id"
      list_url: "/seanchai/records/{parent_id}/documents"
      save_new_url: "/seanchai/record_documents/save"
      save_url: "/seanchai/record_documents/{id}/save"
      delete_url: "/seanchai/record_documents/{id}"
      title_field: "label"
      title_fallback: "Document {seq}"
      prefix_field: "seq"
      badge_field: "status"
      badge_tones:
        verified: "accent"
        not_transcribed: "dim"
      search_fields: ["label", "source_url", "md_path", "status"]
      empty_text: "No documents yet. Use New to add one."
      repo_base_from: "seanchai.repo_blob_base"
      require_one_of:
        fields: ["source_url", "md_path"]
        message: "Enter a source URL, a transcription path, or both"
      fields:
        - name: "label"
          label: "Label"
          control: "text"
          placeholder: "e.g. Deed Book 12, p. 340"
        - name: "source_url"
          label: "Original image URL"
          control: "text"
          placeholder: "FamilySearch or other source (double-click to open)"
          open: "url"
          open_title: "Open the original in a new tab"
        - name: "md_path"
          label: "Transcription path"
          control: "text"
          placeholder: "e.g. docs/records/PR-033/01.md"
          open: "repo"
          open_title: "Open the transcription in the repo"
        - name: "status"
          label: "Status"
          control: "select"
          options_from: "seanchai.document_statuses"

  projects:
    - id: "links"
      label: "Links"
      noun: "link"
      parent_key: "project_id"
      list_url: "/api/query/project_links/for_project?params={parent_id}"
      save_new_url: "/crew/project_links/save"
      save_url: "/crew/project_links/{id}/save"
      delete_url: "/crew/project_links/{id}"
      title_field: "label"
      title_fallback: "(no label)"
      subtitle_field: "url"
      search_fields: ["label", "url"]
      empty_text: "No links yet. Use New to add one."
      duplicate_of: ["label", "url"]
      fields:
        - name: "label"
          label: "Label"
          control: "text"
          placeholder: "Label (required)"
          required: true
        - name: "url"
          label: "URL"
          control: "text"
          placeholder: "URL (optional; double-click to open)"
          open: "url"
          open_title: "Open the link in a new tab"

plugin:
  name: "The Curator"
  version: "0.2.0"
  description: "Web UI and database interface for the projects database"
  type: "web"
  crew_member: "curator"